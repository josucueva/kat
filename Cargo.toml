[package]
name = "kat"
version = "0.3.1"
edition = "2024"
description = "KAT (Knowledge Abstraction Tracker) - a semantic software repository for representing, evolving, tracing, and validating authoritative software knowledge."

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
thiserror = "2"
sha2 = "0.10"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"

[dev-dependencies]
# ObjectStore tests use real temp directories with automatic cleanup.
tempfile = "3"
